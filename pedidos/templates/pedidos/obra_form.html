{% extends 'base.html' %}

{% block title %}Editar Obra{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 560px;">
  <div class="card-header fw-semibold">Editar obra: {{ obra.nombre }}</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
        <a href="{% url 'pedidos:obras' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
